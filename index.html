<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Seed — BIP39 Mnemonic</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #0d1117;
    --surface: #161b22;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --suit-spades: #c9d1d9;
    --suit-hearts: #e63946;
    --suit-diamonds: #e63946;
    --suit-clubs: #2a9d8f;
    --accent: #58a6ff;
    --border: #30363d;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.header h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
    margin-right: auto;
}

.header select {
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
}

.header select:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn {
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
}

.btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.btn-primary:hover:not(:disabled) {
    filter: brightness(1.15);
}

.btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-danger {
    background: transparent;
    color: var(--suit-hearts);
    border-color: var(--suit-hearts);
}

.btn-danger:hover:not(:disabled) {
    background: rgba(230, 57, 70, 0.1);
}

.btn-danger:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.instruction-bar {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: var(--surface);
    border-radius: 6px;
    border-left: 3px solid var(--accent);
}

.main-grid {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 16px;
    margin-bottom: 20px;
}

.suit-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.suit-btn {
    padding: 14px 8px;
    font-size: 1.5rem;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    font-weight: 600;
}

.suit-btn:hover {
    border-color: var(--accent);
}

.suit-btn.active {
    border-color: currentColor;
    box-shadow: 0 0 12px rgba(88, 166, 255, 0.3);
    transform: scale(1.03);
}

.suit-btn[data-suit="S"] { color: var(--suit-spades); }
.suit-btn[data-suit="H"] { color: var(--suit-hearts); }
.suit-btn[data-suit="D"] { color: var(--suit-diamonds); }
.suit-btn[data-suit="C"] { color: var(--suit-clubs); }

.rank-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.rank-grid-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

.rank-grid-row .rank-btn {
    width: 52px;
    height: 52px;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
}

.rank-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #1f2937;
}

.rank-btn:disabled {
    opacity: 0.15;
    cursor: not-allowed;
    text-decoration: line-through;
}

.progress-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
}

progress {
    flex: 1;
    height: 10px;
    border-radius: 5px;
}

progress::-webkit-progress-bar { background: var(--surface); border-radius: 5px; }
progress::-webkit-progress-value { background: var(--accent); border-radius: 5px; }

progress::-moz-progress-bar { background: var(--accent); border-radius: 5px; }

.output-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.output-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.output-field label {
    font-size: 0.85rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.output-field input,
.output-field textarea {
    width: 100%;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s ease;
}

.output-field input:hover,
.output-field textarea:hover {
    border-color: var(--accent);
}

.output-field textarea {
    min-height: 60px;
    resize: vertical;
}

.hidden { display: none !important; }

/* Responsive */
@media (max-width: 600px) {
    .main-grid {
        grid-template-columns: 1fr;
    }
    .suit-panel {
        flex-direction: row;
        justify-content: center;
    }
    .suit-btn {
        padding: 10px 6px;
        font-size: 1.2rem;
        flex: 1;
    }
    .rank-grid-row .rank-btn {
        width: 44px;
        height: 44px;
        font-size: 0.95rem;
    }
    .header h1 {
        font-size: 1.1rem;
        width: 100%;
    }
}

@media (max-width: 400px) {
    .rank-grid-row .rank-btn {
        width: 38px;
        height: 38px;
        font-size: 0.85rem;
    }
    body {
        padding: 12px;
    }
}
</style>
</head>

<div class="header">
    <h1>🧩 Generator Seed</h1>
    <select id="selectWords">
        <option value="12">12 słów</option>
        <option value="15">15 słów</option>
        <option value="18">18 słów</option>
        <option value="21">21 słów</option>
        <option value="24" selected>24 słowa</option>
    </select>
    <button id="btnStart" class="btn btn-primary">Start</button>
    <button id="btnRestart" class="btn btn-danger" disabled>Restart</button>
</div>

<div id="instruction" class="instruction-bar">Wybierz długość mnemonica i kliknij Start</div>

<div id="mainGrid" class="main-grid hidden">
    <div class="suit-panel">
        <button class="suit-btn" data-suit="S">♠<br><small>PIK</small></button>
        <button class="suit-btn" data-suit="H">♥<br><small>KIER</small></button>
        <button class="suit-btn" data-suit="D">♦<br><small>KARO</small></button>
        <button class="suit-btn" data-suit="C">♣<br><small>TREF</small></button>
    </div>
    <div class="rank-panel">
        <div class="rank-grid-row">
            <button class="rank-btn" data-rank="2">2</button>
            <button class="rank-btn" data-rank="3">3</button>
            <button class="rank-btn" data-rank="4">4</button>
            <button class="rank-btn" data-rank="5">5</button>

            <button class="rank-btn" data-rank="7">7</button>
            <button class="rank-btn" data-rank="8">8</button>
            <button class="rank-btn" data-rank="9">9</button>
            <button class="rank-btn" data-rank="T">10</button>
        </div>
        <div class="rank-grid-row rank-grid-row--bottom">
            <button class="rank-btn" data-rank="J">J</button>
            <button class="rank-btn" data-rank="Q">Q</button>
            <button class="rank-btn" data-rank="K">K</button>
            <button class="rank-btn" data-rank="A">A</button>
        </div>
        <div class="progress-container">
            <progress id="progress" max="52" value="0"></progress>
            <span id="progressText">0/52</span>
        </div>
    </div>
</div>

<div class="output-section">
    <div class="output-field">
        <label for="outputEnt">Entropia (karty)</label>
        <input id="outputEnt" type="text" readonly placeholder="—">
    </div>
    <div class="output-field">
        <label for="outputSalt">Salt</label>
        <input id="outputSalt" type="text" readonly placeholder="—">
    </div>
    <div class="output-field">
        <label for="outputSeed">Seed (binarny)</label>
        <input id="outputSeed" type="text" readonly placeholder="—">
    </div>
    <div class="output-field">
        <label for="outputMnemonic">Mnemonic (BIP39)</label>
        <textarea id="outputMnemonic" readonly placeholder="—" rows="3"></textarea>
    </div>
</div>

// ============================================================
// Application State
// ============================================================
let state = 'IDLE';                    // 'IDLE' | 'COLLECTING' | 'DONE'
let activeSuit = null;                 // 'S' | 'H' | 'D' | 'C' | null
let usedCards = { 'S': new Set(), 'H': new Set(), 'D': new Set(), 'C': new Set() };
let totalClicked = 0;
let tbEnt = '';
let tbSalt = '';
let selectedWordIndex = 4;             // default: 24 words (index 4 → 256 bits)

// ============================================================
// DOM References
// ============================================================
const els = {
    selectWords: document.getElementById('selectWords'),
    btnStart: document.getElementById('btnStart'),
    btnRestart: document.getElementById('btnRestart'),
    instruction: document.getElementById('instruction'),
    suitBtns: document.querySelectorAll('.suit-btn'),
    rankBtns: document.querySelectorAll('.rank-btn'),
    progress: document.getElementById('progress'),
    progressText: document.getElementById('progressText'),
    mainGrid: document.getElementById('mainGrid'),
    outputEnt: document.getElementById('outputEnt'),
    outputSalt: document.getElementById('outputSalt'),
    outputSeed: document.getElementById('outputSeed'),
    outputMnemonic: document.getElementById('outputMnemonic'),
};

// ============================================================
// Helper Functions
// ============================================================
function resetCardState() {
    usedCards = { 'S': new Set(), 'H': new Set(), 'D': new Set(), 'C': new Set() };
    totalClicked = 0;
    tbEnt = '';
    tbSalt = '';
    activeSuit = null;
}

function refreshRankButtons() {
    els.rankBtns.forEach(btn => {
        const rank = btn.dataset.rank;
        if (activeSuit && usedCards[activeSuit].has(rank)) {
            btn.disabled = true;
        } else {
            btn.disabled = false;
        }
    });
    if (!activeSuit) {
        els.rankBtns.forEach(btn => btn.disabled = true);
    }
}

function updateInstruction(text) {
    els.instruction.textContent = text;
}

function suitName(s) {
    return { 'S': '♠ Pik', 'H': '♥ Kier', 'D': '♦ Karo', 'C': '♣ Trefl' }[s];
}

// ============================================================
// Core Algorithm
// ============================================================
async function updateSalt() {
    const msg = new TextEncoder().encode(tbSalt + Date.now().toString());
    const hashBuffer = await crypto.subtle.digest('SHA-512', msg);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    tbSalt = btoa(String.fromCharCode(...hashArray));
}

async function finishGeneration() {
    state = 'DONE';
    updateInstruction('Generowanie mnemonica...');

    const ENTROPY_BITS = [128, 160, 192, 224, 256];
    const entLen = ENTROPY_BITS[selectedWordIndex];

    // SHA512(entropy + salt)
    const msg = new TextEncoder().encode(tbEnt + tbSalt);
    const hashBuffer = await crypto.subtle.digest('SHA-512', msg);
    const dane = new Uint8Array(hashBuffer);

    // Truncate to entLen/8 bytes
    const truncated = dane.slice(0, entLen / 8);

    // Convert to binary string
    let seed = '';
    for (let i = 0; i < truncated.length; i++) {
        seed += truncated[i].toString(2).padStart(8, '0');
    }

    // SHA256 checksum
    const csHash = await crypto.subtle.digest('SHA-256', truncated);
    const csBytes = new Uint8Array(csHash);
    const csLen = entLen / 32;
    const csBits = csBytes[0].toString(2).padStart(8, '0').substring(0, csLen);

    seed += csBits;
    els.outputSeed.value = seed;

    // Split into 11-bit chunks → BIP39 words
    const words = [];
    for (let i = 0; i < seed.length; i += 11) {
        const chunk = seed.substring(i, i + 11);
        const index = parseInt(chunk, 2);
        words.push(BIP39_WORDS[index]);
    }

    const mnemonic = words.join(' ');
    els.outputMnemonic.value = mnemonic;

    updateInstruction('Gotowe! Kliknij w mnemonic aby skopiować.');
    els.btnRestart.disabled = false;
    els.btnStart.disabled = true;
}

// ============================================================
// Event Handlers
// ============================================================

// Suit selection
els.suitBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        if (state !== 'COLLECTING') return;
        const suit = btn.dataset.suit;
        selectSuit(suit);
    });
});

function selectSuit(suit) {
    activeSuit = suit;
    els.suitBtns.forEach(b => {
        b.classList.toggle('active', b.dataset.suit === suit);
    });
    refreshRankButtons();
    updateInstruction(`Kolor: ${suitName(suit)} — klikaj rangi kart`);
}

// Rank click
els.rankBtns.forEach(btn => {
    btn.addEventListener('click', async () => {
        if (state !== 'COLLECTING') return;
        if (!activeSuit) {
            updateInstruction('Najpierw wybierz kolor!');
            return;
        }
        const rank = btn.dataset.rank;
        await clickRank(rank);
    });
});

async function clickRank(rank) {
    if (usedCards[activeSuit].has(rank)) return;

    // Mark as used
    usedCards[activeSuit].add(rank);
    totalClicked++;

    // Append to entropy
    const cardName = rank + activeSuit;  // e.g., "2C", "TH", "AS"
    tbEnt += cardName;
    els.outputEnt.value = tbEnt;

    // Update salt (async crypto)
    await updateSalt();
    els.outputSalt.value = tbSalt;

    // Disable the rank button for current active suit
    refreshRankButtons();

    // Update progress
    els.progress.value = totalClicked;
    els.progressText.textContent = `${totalClicked}/52`;
    updateInstruction(`Dodano ${cardName}. ${52 - totalClicked} kart pozostało.`);

    // Check completion
    if (totalClicked === 52) {
        await finishGeneration();
    }
}

// Start button
els.btnStart.addEventListener('click', () => {
    state = 'COLLECTING';
    selectedWordIndex = els.selectWords.selectedIndex;  // 0-4
    resetCardState();
    els.mainGrid.classList.remove('hidden');
    els.btnStart.disabled = true;
    els.selectWords.disabled = true;
    els.btnRestart.disabled = false;
    updateInstruction('Wybierz kolor (♠♥♦♣), potem klikaj rangi kart');
    refreshRankButtons();
});

// Restart button
els.btnRestart.addEventListener('click', () => {
    state = 'IDLE';
    resetCardState();
    els.mainGrid.classList.add('hidden');
    els.btnStart.disabled = false;
    els.selectWords.disabled = false;
    els.btnRestart.disabled = true;
    els.outputEnt.value = '';
    els.outputSalt.value = '';
    els.outputSeed.value = '';
    els.outputMnemonic.value = '';
    els.progress.value = 0;
    els.progressText.textContent = '0/52';
    activeSuit = null;
    els.suitBtns.forEach(b => b.classList.remove('active'));
    updateInstruction('Wybierz długość mnemonica i kliknij Start');
});

// Copy to clipboard on output field clicks
[els.outputEnt, els.outputSalt, els.outputSeed, els.outputMnemonic].forEach(el => {
    el.addEventListener('click', async () => {
        if (!el.value) return;
        try {
            await navigator.clipboard.writeText(el.value);
            const prevText = els.instruction.textContent;
            updateInstruction('Skopiowane do schowka! ✓');
            setTimeout(() => {
                els.instruction.textContent = prevText;
            }, 1500);
        } catch (err) {
            // Fallback for older browsers
            el.select();
            document.execCommand('copy');
            const prevText = els.instruction.textContent;
            updateInstruction('Skopiowane do schowka! ✓');
            setTimeout(() => {
                els.instruction.textContent = prevText;
            }, 1500);
        }
    });
});

// ============================================================
// Initialization
// ============================================================
function init() {
    els.mainGrid.classList.add('hidden');
    els.btnRestart.disabled = true;
    els.selectWords.value = '24';
    updateInstruction('Wybierz długość mnemonica i kliknij Start');
}

document.addEventListener('DOMContentLoaded', init);
</script>
