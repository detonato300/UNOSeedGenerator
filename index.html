<!DOCTYPE html>
<html lang="pl">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #0d1117;
    --surface: #161b22;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --suit-spades: #c9d1d9;
    --suit-hearts: #e63946;
    --suit-diamonds: #e63946;
    --suit-clubs: #2a9d8f;
    --accent: #58a6ff;
    --border: #30363d;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.header h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
    margin-right: auto;
}

.btn {
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
}

.btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.btn-primary:hover:not(:disabled) {
    filter: brightness(1.15);
}

.btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-danger {
    background: transparent;
    color: var(--suit-hearts);
    border-color: var(--suit-hearts);
}

.btn-danger:hover:not(:disabled) {
    background: rgba(230, 57, 70, 0.1);
}

.btn-danger:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-lang {
    background: transparent;
    color: var(--text-muted);
    border-color: var(--border);
    padding: 8px 12px;
    font-size: 0.85rem;
    min-width: 48px;
}

.btn-lang:hover {
    border-color: var(--accent);
    color: var(--text);
}

.instruction-bar {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: var(--surface);
    border-radius: 6px;
    border-left: 3px solid var(--accent);
}

/* ——— Start Panel (instructions + length buttons) ——— */
.start-panel {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 24px 20px;
    margin-bottom: 20px;
}

.start-panel h2 {
    font-size: 1.1rem;
    margin-bottom: 12px;
    color: var(--accent);
}

.start-panel ol {
    padding-left: 20px;
    margin-bottom: 16px;
    line-height: 1.6;
    font-size: 0.9rem;
    color: var(--text);
}

.start-prompt {
    text-align: center;
    font-weight: 600;
    margin-bottom: 12px;
    font-size: 1rem;
}

.length-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn-length {
    background: var(--surface);
    color: var(--accent);
    border-color: var(--accent);
    padding: 10px 18px;
    font-size: 0.95rem;
}

.btn-length:hover {
    background: var(--accent);
    color: #fff;
}

.start-tip {
    text-align: center;
    color: var(--text-muted);
    font-style: italic;
    margin-top: 12px;
    font-size: 0.85rem;
}

.main-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 20px;
}

.suit-panel {
    display: flex;
    flex-direction: row;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.suit-btn {
    flex: 1;
    min-width: 80px;
    padding: 14px 8px;
    font-size: 1.5rem;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    font-weight: 600;
}

.suit-btn:hover {
    border-color: var(--accent);
}

.suit-btn.active {
    border-color: currentColor;
    box-shadow: 0 0 12px rgba(88, 166, 255, 0.3);
    transform: scale(1.03);
}

.suit-btn[data-suit="S"] { color: var(--suit-spades); }
.suit-btn[data-suit="H"] { color: var(--suit-hearts); }
.suit-btn[data-suit="D"] { color: var(--suit-diamonds); }
.suit-btn[data-suit="C"] { color: var(--suit-clubs); }

.rank-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.rank-grid-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

.rank-grid-row .rank-btn {
    width: 52px;
    height: 52px;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
}

.rank-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #1f2937;
}

.rank-btn:disabled {
    opacity: 0.15;
    cursor: not-allowed;
    text-decoration: line-through;
}

.progress-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
}

progress {
    flex: 1;
    height: 10px;
    border-radius: 5px;
}

progress::-webkit-progress-bar { background: var(--surface); border-radius: 5px; }
progress::-webkit-progress-value { background: var(--accent); border-radius: 5px; }

progress::-moz-progress-bar { background: var(--accent); border-radius: 5px; }

.output-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.output-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.output-field label {
    font-size: 0.85rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.output-field input,
.output-field textarea {
    width: 100%;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s ease;
}

.output-field input:hover,
.output-field textarea:hover {
    border-color: var(--accent);
}

.output-field textarea {
    min-height: 60px;
    resize: vertical;
}

.hidden { display: none !important; }

/* ——— Toggle / Reveal / Round2 Styles ——— */
.btn-toggle {
    background: transparent;
    color: var(--text-muted);
    border: 1px dashed var(--border);
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.15s ease;
    width: fit-content;
}
.btn-toggle:hover {
    border-color: var(--accent);
    color: var(--text);
}
.btn-toggle:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-success {
    background: #2ea043;
    color: #fff;
    border-color: #2ea043;
}
.btn-success:hover:not(:disabled) {
    filter: brightness(1.15);
}

.round2-prompt {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 24px 20px;
    margin-bottom: 20px;
    text-align: center;
}
.round2-prompt p {
    font-size: 1rem;
    margin-bottom: 16px;
    line-height: 1.5;
}
.round2-prompt .btn {
    font-size: 1rem;
    padding: 10px 28px;
}

.salt-field,
.mnemonic-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

/* Responsive */
@media (max-width: 600px) {
    .suit-btn {
        padding: 10px 6px;
        font-size: 1.2rem;
        flex: 1;
    }
    .rank-grid-row .rank-btn {
        width: 44px;
        height: 44px;
        font-size: 0.95rem;
    }
    .header h1 {
        font-size: 1.1rem;
        width: 100%;
    }
    .btn-length {
        padding: 8px 14px;
        font-size: 0.85rem;
    }
}

@media (max-width: 400px) {
    .rank-grid-row .rank-btn {
        width: 38px;
        height: 38px;
        font-size: 0.85rem;
    }
    body {
        padding: 12px;
    }
}
</style>
</head>

<div class="header">
    <h1 id="headerTitle"></h1>
    <button id="btnLangToggle" class="btn btn-lang"></button>
    <button id="btnRestart" class="btn btn-danger" disabled></button>
</div>

<div id="instruction" class="instruction-bar"></div>

<div id="startPanel" class="start-panel">

        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ol>
    <p class="start-prompt" id="startPrompt"></p>
    <div class="length-buttons">
        <button class="btn btn-length" data-words="12"></button>
        <button class="btn btn-length" data-words="15"></button>
        <button class="btn btn-length" data-words="18"></button>
        <button class="btn btn-length" data-words="21"></button>
        <button class="btn btn-length" data-words="24"></button>
    </div>
</div>

<div id="mainGrid" class="main-grid hidden">

        <button id="suitBtnC" class="suit-btn" data-suit="C"></button>
        <button id="suitBtnD" class="suit-btn" data-suit="D"></button>
        <button id="suitBtnS" class="suit-btn" data-suit="S"></button>
        <button id="suitBtnH" class="suit-btn" data-suit="H"></button>
    </div>
    <div class="rank-panel">
        <div class="rank-grid-row">
            <button class="rank-btn" data-rank="2">2</button>
            <button class="rank-btn" data-rank="3">3</button>
            <button class="rank-btn" data-rank="4">4</button>
            <button class="rank-btn" data-rank="5">5</button>
            <button class="rank-btn" data-rank="6">6</button>
            <button class="rank-btn" data-rank="7">7</button>
            <button class="rank-btn" data-rank="8">8</button>
            <button class="rank-btn" data-rank="9">9</button>
            <button class="rank-btn" data-rank="T">10</button>
        </div>
        <div class="rank-grid-row rank-grid-row--bottom">
            <button class="rank-btn" data-rank="J">J</button>
            <button class="rank-btn" data-rank="Q">Q</button>
            <button class="rank-btn" data-rank="K">K</button>
            <button class="rank-btn" data-rank="A">A</button>
        </div>
        <div class="progress-container">
            <progress id="progress" max="52" value="0"></progress>
            <span id="progressText">0/52</span>
        </div>
    </div>
</div>

<!-- Round 2 prompt (hidden by default, shown after 52 cards for 24 words) -->
<div id="round2Prompt" class="round2-prompt hidden">
    <p id="round2Text"></p>
    <button id="btnRound2" class="btn btn-primary"></button>
</div>

<div class="output-section">
    <div class="output-field">
        <label for="outputEnt" id="labelEntropy"></label>
        <input id="outputEnt" type="text" readonly placeholder="—">
    </div>
    <div class="output-field">
        <button id="btnToggleSalt" class="btn btn-toggle" disabled></button>
    </div>
    <div class="salt-field hidden" id="saltField">
        <label for="outputSalt" id="labelSalt"></label>
        <input id="outputSalt" type="text" readonly placeholder="—">
    </div>
        <div class="output-field">
        <button id="btnRevealMnemonic" class="btn btn-primary" disabled></button>
    </div>
    <div class="output-field hidden" id="binaryMnemonicField">
        <label for="outputSeed" id="labelBinary"></label>
        <input id="outputSeed" type="text" readonly placeholder="—">
    </div>
    <div class="mnemonic-field hidden" id="mnemonicField">
        <label for="outputMnemonic" id="labelMnemonic"></label>
        <textarea id="outputMnemonic" readonly placeholder="—" rows="3"></textarea>
    </div>
</div>

// ============================================================
// Language Detection & Translation
// ============================================================
let currentLang = 'pl';

function detectLanguage() {
    const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    currentLang = browserLang.startsWith('pl') ? 'pl' : 'en';
}

function t(key, ...args) {
    let val = I18N[currentLang][key];
    if (typeof val === 'function') return val(...args);
    return val !== undefined ? val : key;
}

function tArray(key) {
    return I18N[currentLang][key] || [];
}

let tbSalt = '';

// Helper Functions
// ============================================================
function resetCardState() {
    usedCards = { 'S': new Set(), 'H': new Set(), 'D': new Set(), 'C': new Set() };
    totalClicked = 0;
    tbEnt = '';
    tbSalt = '';
    activeSuit = null;
}

function getCardsRequired() {
    return CARDS_REQUIRED[selectedWordIndex];
}

function needsSecondRound() {
    return NEEDS_SECOND_ROUND[selectedWordIndex];
}

function refreshRankButtons() {
    els.rankBtns.forEach(btn => {
        const rank = btn.dataset.rank;
        if (activeSuit && usedCards[activeSuit].has(rank)) {
            btn.disabled = true;
        } else {
            btn.disabled = false;
        }
    });
    if (!activeSuit) {
        els.rankBtns.forEach(btn => btn.disabled = true);
    }
}

function updateInstruction(key, ...args) {
    _instrKey = key;
    _instrArgs = args;
    _resolveInstruction();
}

function _resolveInstruction() {
    // t() handles both plain strings and functions (like cardAdded, suitSelected)
    els.instruction.textContent = t(_instrKey, ..._instrArgs);
}

function suitName(s) {
    return {
        'C': t('suitClubs'),
        'D': t('suitDiamonds'),
        'S': t('suitSpades'),
        'H': t('suitHearts')
    }[s];
}

// ============================================================
// Core Algorithm
// ============================================================
async function updateSalt() {
    const msg = new TextEncoder().encode(tbSalt + Date.now().toString());
    const hashBuffer = await crypto.subtle.digest('SHA-512', msg);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    tbSalt = btoa(String.fromCharCode(...hashArray));
}

async function finishGeneration() {
    state = 'DONE';
    updateInstruction('generating');

    const ENTROPY_BITS = [128, 160, 192, 224, 256];
    const entLen = ENTROPY_BITS[selectedWordIndex];

    // SHA512(entropy + salt)
    // tbEnt = card-derived entropy (concatenated card names)
    // tbSalt = progressive SHA-512 chain of click timestamps
    const msg = new TextEncoder().encode(tbEnt + tbSalt);
    const hashBuffer = await crypto.subtle.digest('SHA-512', msg);
    const dane = new Uint8Array(hashBuffer);

    // Truncate to entLen/8 bytes
    const truncated = dane.slice(0, entLen / 8);

    // Convert to binary string
    let seed = '';
    for (let i = 0; i < truncated.length; i++) {
        seed += truncated[i].toString(2).padStart(8, '0');
    }

    // SHA256 checksum
    const csHash = await crypto.subtle.digest('SHA-256', truncated);
    const csBytes = new Uint8Array(csHash);
    const csLen = entLen / 32;
    const csBits = csBytes[0].toString(2).padStart(8, '0').substring(0, csLen);

    seed += csBits;
    els.outputSeed.value = seed;

    // Split into 11-bit chunks → BIP39 words
    const words = [];
    for (let i = 0; i < seed.length; i += 11) {
        const chunk = seed.substring(i, i + 11);
        const index = parseInt(chunk, 2);
        words.push(BIP39_WORDS[index]);
    }

    const mnemonic = words.join(' ');
    els.outputMnemonic.value = mnemonic;

    // Hide the card grid, reveal the "Pokaż mnemonik" button instead of the mnemonic itself
    els.mainGrid.classList.add('hidden');
    els.round2Prompt.classList.add('hidden');
    els.btnRevealMnemonic.disabled = false;
    els.btnRevealMnemonic.textContent = t('revealMnemonic');

    updateInstruction('done');
    els.btnRestart.disabled = false;
}

// ============================================================
// Event Handlers
// ============================================================

// Suit selection (works in both COLLECTING and COLLECTING_ROUND2 states)
els.suitBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        if (state !== 'COLLECTING' && state !== 'COLLECTING_ROUND2') return;
        const suit = btn.dataset.suit;
        selectSuit(suit);
    });
});

function selectSuit(suit) {
    activeSuit = suit;
    els.suitBtns.forEach(b => {
        b.classList.toggle('active', b.dataset.suit === suit);
    });
    refreshRankButtons();
    updateInstruction('suitSelected', suit);
}

// Rank click (works in both COLLECTING and COLLECTING_ROUND2 states)
els.rankBtns.forEach(btn => {
    btn.addEventListener('click', async () => {
        if (state !== 'COLLECTING' && state !== 'COLLECTING_ROUND2') return;
        if (!activeSuit) {
            updateInstruction('pickSuitFirst');
            return;
        }
        const rank = btn.dataset.rank;
        await clickRank(rank);
    });
});

async function clickRank(rank) {
    if (usedCards[activeSuit].has(rank)) return;

    // Mark as used
    usedCards[activeSuit].add(rank);
    totalClicked++;

    // Append to entropy (card name, e.g. "2C", "TH", "AS")
    const cardName = rank + activeSuit;
    tbEnt += cardName;
    els.outputEnt.value = tbEnt;

    // Update salt progressively (async crypto): SHA512(prevSalt + clickTimestamp)
    await updateSalt();
    els.outputSalt.value = tbSalt;

    // Disable the rank button for current active suit
    refreshRankButtons();

    // How many cards does the current round require?
    const required = (round === 2) ? SECOND_ROUND_CARDS : getCardsRequired();

    // Update progress
    els.progress.value = totalClicked;
    els.progressText.textContent = `${totalClicked}/${required}`;
    updateInstruction('cardAdded', cardName, required - totalClicked);

    // Check completion
    if (totalClicked >= required) {
        if (round === 1 && needsSecondRound()) {
            // Full deck drawn for 24 words — ask user to reshuffle
            transitionToRound2Prompt();
        } else {
            await finishGeneration();
        }
    }
}

// Show the reshuffle prompt after 52 cards (24 words only)
function transitionToRound2Prompt() {
    state = 'ROUND2_PROMPT';
    els.mainGrid.classList.add('hidden');
    els.round2Prompt.classList.remove('hidden');
    els.btnToggleSalt.disabled = true;
    updateInstruction('round2Instruction');
}

// Start the second round: fresh deck, entropy/salt preserved
function startRound2() {
    state = 'COLLECTING_ROUND2';
    round = 2;
    usedCards = { 'S': new Set(), 'H': new Set(), 'D': new Set(), 'C': new Set() };
    totalClicked = 0;
    activeSuit = null;

    els.round2Prompt.classList.add('hidden');
    els.mainGrid.classList.remove('hidden');
    els.progress.max = SECOND_ROUND_CARDS;
    els.progress.value = 0;
    els.progressText.textContent = `0/${SECOND_ROUND_CARDS}`;
    els.suitBtns.forEach(b => b.classList.remove('active'));
    els.btnToggleSalt.disabled = false;
    refreshRankButtons();
    updateInstruction('round2Title');
}

// Start generation — called by length buttons
function startGeneration() {
    state = 'COLLECTING';
    round = 1;
    resetCardState();
    saltVisible = false;
    mnemonicRevealed = false;

    const required = getCardsRequired();
    els.startPanel.classList.add('hidden');
    els.mainGrid.classList.remove('hidden');
    els.round2Prompt.classList.add('hidden');
    els.btnRestart.disabled = false;
    els.progress.max = required;
    els.progress.value = 0;
    els.progressText.textContent = `0/${required}`;
    els.btnRevealMnemonic.disabled = true;
    els.btnRevealMnemonic.textContent = t('revealMnemonic');
    els.btnRevealMnemonic.classList.remove('btn-success');
    els.mnemonicField.classList.add('hidden');
    els.binaryMnemonicField.classList.add('hidden');
    els.btnToggleSalt.disabled = false;
    els.saltField.classList.add('hidden');
    els.btnToggleSalt.textContent = t('showSalt');
    updateInstruction('pickSuit');
    refreshRankButtons();
}

// Length buttons — each starts the process directly
els.lengthBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const words = parseInt(btn.dataset.words);
        selectedWordIndex = WORD_COUNTS.indexOf(words);
        startGeneration();
    });
});

// Language toggle
els.btnLangToggle.addEventListener('click', () => {
    currentLang = currentLang === 'pl' ? 'en' : 'pl';
    refreshAllTexts();
});

// Restart button
els.btnRestart.addEventListener('click', () => {
    state = 'IDLE';
    round = 1;
    resetCardState();
    saltVisible = false;
    mnemonicRevealed = false;
    els.startPanel.classList.remove('hidden');
    els.mainGrid.classList.add('hidden');
    els.round2Prompt.classList.add('hidden');
    els.btnRestart.disabled = true;
    els.outputEnt.value = '';
    els.outputSalt.value = '';
    els.outputSeed.value = '';
    els.outputMnemonic.value = '';
    els.saltField.classList.add('hidden');
    els.btnToggleSalt.textContent = t('showSalt');
    els.btnToggleSalt.disabled = true;
    els.mnemonicField.classList.add('hidden');
    els.binaryMnemonicField.classList.add('hidden');
    els.btnRevealMnemonic.disabled = true;
    els.btnRevealMnemonic.textContent = t('revealMnemonic');
    els.btnRevealMnemonic.classList.remove('btn-success');
    els.progress.value = 0;
    els.progressText.textContent = '0/52';
    activeSuit = null;
    els.suitBtns.forEach(b => b.classList.remove('active'));
    updateInstruction('instructionIdle');
});

// ============================================================
// Salt toggle — show/hide the salt field
// ============================================================
els.btnToggleSalt.addEventListener('click', () => {
    saltVisible = !saltVisible;
    els.saltField.classList.toggle('hidden', !saltVisible);
    els.btnToggleSalt.textContent = saltVisible ? t('hideSalt') : t('showSalt');
});

// ============================================================
// Mnemonic reveal / copy to clipboard
// ============================================================
els.btnRevealMnemonic.addEventListener('click', async () => {
    if (mnemonicRevealed) {
        // Copy to clipboard
        try {
            await navigator.clipboard.writeText(els.outputMnemonic.value);
            updateInstruction('copied');
        } catch (err) {
            els.outputMnemonic.select();
            document.execCommand('copy');
            updateInstruction('copied');
        }
    } else {
        // First click: reveal the mnemonic
        mnemonicRevealed = true;
        els.mnemonicField.classList.remove('hidden');
        els.binaryMnemonicField.classList.remove('hidden');
        els.btnRevealMnemonic.textContent = t('copyMnemonic');
        els.btnRevealMnemonic.classList.add('btn-success');
        updateInstruction('mnemonicRevealed');
    }
});

// ============================================================
// Round 2 — continue after reshuffle
// ============================================================
els.btnRound2.addEventListener('click', startRound2);

// ============================================================
// Copy to clipboard on output field clicks (entropy, seed only)
// ============================================================
[els.outputEnt, els.outputSeed].forEach(el => {
    el.addEventListener('click', async () => {
        if (!el.value) return;
        try {
            await navigator.clipboard.writeText(el.value);
            const prevText = els.instruction.textContent;
            updateInstruction('copied');
            setTimeout(() => {
                els.instruction.textContent = prevText;
            }, 1500);
        } catch (err) {
            el.select();
            document.execCommand('copy');
            const prevText = els.instruction.textContent;
            updateInstruction('copied');
            setTimeout(() => {
                els.instruction.textContent = prevText;
            }, 1500);
        }
    });
});

// ============================================================
// Initialization
// ============================================================
function init() {
    detectLanguage();
    saltVisible = false;
    mnemonicRevealed = false;
    els.mainGrid.classList.add('hidden');
    els.round2Prompt.classList.add('hidden');
    els.startPanel.classList.remove('hidden');
    els.btnRestart.disabled = true;
    els.btnRevealMnemonic.disabled = true;
    els.btnToggleSalt.disabled = true;
    els.mnemonicField.classList.add('hidden');
    els.binaryMnemonicField.classList.add('hidden');
    els.saltField.classList.add('hidden');
    selectedWordIndex = 4; // default: 24 words
    refreshAllTexts();
    updateInstruction('instructionIdle');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
